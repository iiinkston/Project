# Official Windows release pipeline for MJH Printer Platform.
# Trigger: git tag v* (example: v1.0.4)
#
# Produces:
#   - MJH-Printer-Setup.exe          (Client NSIS installer, embeds Agent)
#   - MJH-Printer-Agent-*.zip        (standalone Agent package)
#   - release-metadata.json

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build & Publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # electron-builder: skip code signing in CI
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Prefer explicit non-interactive installs
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            mjh-printer-agent/pnpm-lock.yaml
            mjh-printer-client/pnpm-lock.yaml

      - name: Install dependencies (Agent)
        working-directory: mjh-printer-agent
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Client)
        working-directory: mjh-printer-client
        run: pnpm install --frozen-lockfile

      # ── Agent ──────────────────────────────────────────────
      - name: Agent test
        working-directory: mjh-printer-agent
        run: pnpm test

      - name: Agent typecheck
        working-directory: mjh-printer-agent
        run: pnpm typecheck

      - name: Agent build:exe
        working-directory: mjh-printer-agent
        run: pnpm build:exe

      # ── Client (stages Agent release into installer) ──────
      - name: Client test
        working-directory: mjh-printer-client
        run: pnpm test

      - name: Client typecheck
        working-directory: mjh-printer-client
        run: pnpm typecheck

      - name: Client dist:setup
        working-directory: mjh-printer-client
        run: pnpm dist:setup

      # ── Collect artifacts + metadata ──────────────────────
      - name: Stage release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $out = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $agentZipDir = Join-Path $env:GITHUB_WORKSPACE "mjh-printer-agent\release"
          $agentZips = Get-ChildItem -LiteralPath $agentZipDir -Filter "MJH-Printer-Agent-*.zip"
          if (-not $agentZips -or $agentZips.Count -eq 0) {
            throw "No Agent zip found under mjh-printer-agent/release/MJH-Printer-Agent-*.zip"
          }
          foreach ($z in $agentZips) {
            Copy-Item -LiteralPath $z.FullName -Destination (Join-Path $out $z.Name) -Force
            Write-Host "Staged Agent zip: $($z.Name)"
          }

          $setupSrc = Join-Path $env:GITHUB_WORKSPACE "dist\client-build\MJH Printer Setup.exe"
          if (-not (Test-Path -LiteralPath $setupSrc)) {
            throw "Client Setup missing: $setupSrc"
          }
          # Space-free asset name for stable download URLs
          $setupName = "MJH-Printer-Setup.exe"
          Copy-Item -LiteralPath $setupSrc -Destination (Join-Path $out $setupName) -Force
          Write-Host "Staged Client Setup: $setupName"

          $agentPkg = Get-Content (Join-Path $env:GITHUB_WORKSPACE "mjh-printer-agent\package.json") -Raw | ConvertFrom-Json
          $clientPkg = Get-Content (Join-Path $env:GITHUB_WORKSPACE "mjh-printer-client\package.json") -Raw | ConvertFrom-Json
          $agentVersion = [string]$agentPkg.version
          $clientVersion = [string]$clientPkg.version

          $repo = "${{ github.repository }}"
          $base = "https://github.com/$repo/releases/download/$tag"
          $primaryAgentZip = ($agentZips | Sort-Object Name | Select-Object -First 1).Name

          $metadata = [ordered]@{
            version       = $tag
            clientVersion = $clientVersion
            agentVersion  = $agentVersion
            downloadUrl   = [ordered]@{
              client = "$base/$setupName"
              agent  = "$base/$primaryAgentZip"
            }
            assets        = [ordered]@{
              clientSetup = $setupName
              agentZips   = @($agentZips | ForEach-Object { $_.Name })
            }
            repository    = $repo
            commit        = "${{ github.sha }}"
            publishedAt   = (Get-Date).ToUniversalTime().ToString("o")
          }

          $metaPath = Join-Path $out "release-metadata.json"
          ($metadata | ConvertTo-Json -Depth 6) | Set-Content -LiteralPath $metaPath -Encoding utf8
          Write-Host "Wrote $metaPath"
          Get-Content -LiteralPath $metaPath

          "AGENT_VERSION=$agentVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLIENT_VERSION=$clientVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mjh-windows-release-${{ github.ref_name }}
          path: release-assets/**
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MJH Printer ${{ github.ref_name }}
          body: |
            ## MJH Printer Platform ${{ github.ref_name }}

            | Package | Version |
            |---------|---------|
            | Client Setup | `${{ env.CLIENT_VERSION }}` |
            | Agent | `${{ env.AGENT_VERSION }}` |

            ### Downloads
            - **Client (NSIS Setup):** `MJH-Printer-Setup.exe`
            - **Agent (standalone zip):** `MJH-Printer-Agent-*.zip`
            - **Metadata:** `release-metadata.json`

            Install Client Setup on store PCs (embeds Agent + Task Scheduler).
          files: |
            release-assets/MJH-Printer-Setup.exe
            release-assets/MJH-Printer-Agent-*.zip
            release-assets/release-metadata.json
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
