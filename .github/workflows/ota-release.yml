# MJH Printer OTA release pipeline
# Trigger: git tag matching v* only
#
# release-metadata.json client.version = git tag semver
# agent.version = mjh-printer-agent/package.json

name: OTA Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ota-release:
    name: Build, metadata, GitHub Release
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CI: "true"

    steps:

      # FIX: fetch full git history and tags
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            mjh-printer-agent/pnpm-lock.yaml
            mjh-printer-client/pnpm-lock.yaml


      - name: Pre-release version gate
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"

          function Read-ScriptJson([object]$raw, [string]$label) {
            $line = @($raw) |
              Where-Object {
                $_ -and ("$_").Trim().StartsWith("{")
              } |
              Select-Object -Last 1

            if (-not $line) {
              throw "No JSON object in $label stdout"
            }

            return ($line | ConvertFrom-Json)
          }


          $gateRaw = & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\scripts\validate-release-versions.ps1" `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -Tag $tag

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }


          $gate = Read-ScriptJson $gateRaw "validate-release-versions"


          $tagRaw = & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\scripts\parse-release-tag.ps1" `
            -Tag $tag


          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }


          $tagInfo = Read-ScriptJson $tagRaw "parse-release-tag"


          $clientVersion = [string]$tagInfo.clientVersion
          $agentVersion = [string]$gate.agentVersion


          if (-not $clientVersion) {
            throw "Failed to parse client version from tag $tag"
          }


          if (-not $agentVersion) {
            throw "Failed to read agent version"
          }


          Write-Host "RELEASE_CLIENT_VERSION=$clientVersion"
          Write-Host "AGENT_VERSION=$agentVersion"


          "client_version=$clientVersion" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8


          "agent_version=$agentVersion" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8


          "CLIENT_VERSION=$clientVersion" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8


          "AGENT_VERSION=$agentVersion" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8



      # -------------------------
      # Agent
      # -------------------------

      - name: Install Agent dependencies
        working-directory: mjh-printer-agent
        run: pnpm install --frozen-lockfile


      - name: Agent test
        working-directory: mjh-printer-agent
        run: pnpm test


      - name: Agent typecheck
        working-directory: mjh-printer-agent
        run: pnpm typecheck


      - name: Agent build exe
        working-directory: mjh-printer-agent
        run: pnpm build:exe



      # -------------------------
      # Client
      # -------------------------

      - name: Install Client dependencies
        working-directory: mjh-printer-client
        run: pnpm install --frozen-lockfile


      # Inject Client package.json version from git tag (workspace only; not committed).
      # electron-builder / Vite read this for Setup ProductVersion and asar package.json.
      - name: Inject Client version from git tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\set-client-version-from-tag.ps1" `
            -Tag $tag `
            -WorkspaceRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ver = node -p "require(process.argv[1]).version" "$env:GITHUB_WORKSPACE\mjh-printer-client\package.json"
          Write-Host "CLIENT_PACKAGE_JSON_VERSION=$ver"
          if ($ver -ne "${{ steps.ver.outputs.client_version }}") {
            throw "Injected package.json version='$ver' != tag client_version='${{ steps.ver.outputs.client_version }}'"
          }


      - name: Client dist setup
        working-directory: mjh-printer-client
        run: pnpm dist:setup


      - name: Validate Client Setup ProductVersion
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $clientVersion = "${{ steps.ver.outputs.client_version }}"
          $setupSrc = "$env:GITHUB_WORKSPACE\dist\client-build\MJH Printer Setup.exe"
          $asarPath = "$env:GITHUB_WORKSPACE\dist\client-build\win-unpacked\resources\app.asar"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\validate-client-build-version.ps1" `
            -ExpectedVersion $clientVersion `
            -SetupPath $setupSrc `
            -AsarPath $asarPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }



      # -------------------------
      # Metadata
      # -------------------------

      - name: Stage release assets and metadata
        shell: pwsh
        run: |

          $ErrorActionPreference="Stop"


          $tag="${{ github.ref_name }}"
          $repo="${{ github.repository }}"


          $clientVersion="${{ steps.ver.outputs.client_version }}"
          $agentVersion="${{ steps.ver.outputs.agent_version }}"


          $ws=$env:GITHUB_WORKSPACE


          $out=Join-Path $ws "release"


          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out | Out-Null



          $setupName="MJH-Printer-Setup.exe"

          $agentZipName="MJH-Printer-Agent-v$agentVersion.zip"



          $setupSrc="$ws\dist\client-build\MJH Printer Setup.exe"

          $agentZipSrc="$ws\mjh-printer-agent\release\$agentZipName"



          if (!(Test-Path $setupSrc)) {
            throw "Missing client setup"
          }


          if (!(Test-Path $agentZipSrc)) {
            throw "Missing agent zip"
          }

          # Re-validate Setup ProductVersion before publishing metadata
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$ws\scripts\validate-client-build-version.ps1" `
            -ExpectedVersion $clientVersion `
            -SetupPath $setupSrc `
            -AsarPath "$ws\dist\client-build\win-unpacked\resources\app.asar"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }



          $setupDst="$out\$setupName"

          $agentDst="$out\$agentZipName"



          Copy-Item $setupSrc $setupDst -Force

          Copy-Item $agentZipSrc $agentDst -Force



          $clientSha=(Get-FileHash `
            $setupDst `
            -Algorithm SHA256).Hash.ToLower()



          $agentSha=(Get-FileHash `
            $agentDst `
            -Algorithm SHA256).Hash.ToLower()



          $base="https://github.com/$repo/releases/download/$tag"



          $metadata=[ordered]@{

            client=[ordered]@{
              version=$clientVersion
              url="$base/$setupName"
              sha256=$clientSha
            }


            agent=[ordered]@{
              version=$agentVersion
              url="$base/$agentZipName"
              sha256=$agentSha
            }

          }



          $metaPath="$out\release-metadata.json"


          [System.IO.File]::WriteAllText(
            $metaPath,
            ($metadata | ConvertTo-Json -Depth 6)+"`n",
            (New-Object System.Text.UTF8Encoding $false)
          )



          & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$ws\scripts\validate-release-metadata.ps1" `
            -MetadataPath $metaPath `
            -ClientSetupPath $setupDst `
            -AgentZipPath $agentDst `
            -ExpectedClientVersion $clientVersion `
            -ExpectedAgentVersion $agentVersion `
            -ReleaseTag $tag


          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }



          $notes="$out\RELEASE_NOTES.md"


          & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$ws\scripts\generate-release-notes.ps1" `
            -Tag $tag `
            -ClientVersion $clientVersion `
            -AgentVersion $agentVersion `
            -Repository $repo `
            -OutFile $notes



          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }



      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mjh-ota-release-${{ github.ref_name }}
          path: release/**
          if-no-files-found: error



      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ github.ref_name }}

          name: MJH Printer ${{ github.ref_name }}

          body_path: release/RELEASE_NOTES.md

          files: |
            release/MJH-Printer-Setup.exe
            release/MJH-Printer-Agent-v${{ env.AGENT_VERSION }}.zip
            release/release-metadata.json

          fail_on_unmatched_files: true

          # FIX:
          # use our own RELEASE_NOTES.md
          generate_release_notes: false


        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}